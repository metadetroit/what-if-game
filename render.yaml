services:
  # Backend Web Service (also serves frontend)
  - type: web
    name: what-if-game-backend
    runtime: node
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend && npm install --prefix backend
    startCommand: npm start --prefix backend
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
    plan: free
    healthCheckPath: /
