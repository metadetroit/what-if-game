services:
  # Authoritative single-service Render Blueprint.
  - type: web
    name: what-if-game-backend
    runtime: node
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://playfluke.com,https://www.playfluke.com
      - key: ADMIN_KEY
        sync: false
    plan: free
    healthCheckPath: /api/health
