services:
  # Backend Web Service (also serves frontend)
  - type: web
    name: what-if-game-backend
    runtime: node
    buildCommand: cd .. && npm install --prefix frontend && npm run build --prefix frontend && npm install --prefix backend
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://what-if-game-v2.onrender.com
      - key: ADMIN_KEY
        sync: false
    plan: free
    healthCheckPath: /api/health
