services:
  # Backend Web Service
  - type: web
    name: what-if-game-backend
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
    plan: free
    healthCheckPath: /

  # Frontend Static Site
  - type: static
    name: what-if-game-frontend
    buildCommand: cd frontend && npm install && npm run build
    publishDir: frontend/dist
    envVars:
      - key: VITE_SOCKET_URL
        fromService:
          name: what-if-game-backend
          type: web
          property: host
          template: "https://{{host}}"
    plan: free
